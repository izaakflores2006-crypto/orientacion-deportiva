name: Actualizacion Diaria de Partidos
on:
  schedule:
    - cron: '0 12 * * *' # Corre diario a las 6:00 AM hora México
  workflow_dispatch: # Botón manual por si quieres forzar la actualización

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Clonar repositorio
      uses: actions/checkout@v3

    - name: Configurar Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Ejecutar Bot de Actualización
      run: python actualizar_partidos.py

    - name: Guardar cambios y subir a GitHub Pages
      run: |
        git config --global user.name "BotAnalista"
        git config --global user.email "bot@analista.com"
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Actualización multi-deporte automática" && git push)
        
